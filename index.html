<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile card</title>
<style>
  :root {
    /* one grade applied to BOTH images so they sit at the same brightness / contrast / color */
    /* identical image grade keeps cover + avatar visually in the same tonal family */
    --grade: brightness(.93) contrast(1.04) saturate(.84);
    --tint: rgba(150, 152, 170, .16);   /* shared soft tone laid over both images */
    --paper: #f3eee3;                    /* off-white used for hearts */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center;
    min-height: 100dvh;
    background: #0b0a0a;
    overflow: hidden;
  }

  /* cover image tiled behind everything, blurred */
  .backdrop {
    position: fixed; inset: -3%;
    background-color: #0b0a0a;
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;
    filter: var(--grade) blur(3px) brightness(.58);
    transform: scale(1.025);
  }

  canvas.glitterBack {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  .card {
    position: relative;
    width: min(700px, 94vw);
    aspect-ratio: 700 / 600;
    z-index: 2;
  }

  /* ---------- banner ---------- */
  .banner {
    position: absolute; left: 0; top: 0; width: 100%; height: 57.5%;
    z-index: 1;
    border: 2px solid #f1f1f1;
    border-radius: 14px;
    overflow: hidden;
    background: #050505;
    cursor: pointer;
    /* soft white light, very gentle */
    box-shadow: 0 0 10px rgba(255,255,255,.26), 0 0 34px rgba(255,255,255,.09);
    animation: lightBanner 8s ease-in-out infinite alternate;
  }
  @keyframes lightBanner {
    to { box-shadow: 0 0 14px rgba(255,255,255,.34), 0 0 44px rgba(255,255,255,.13); }
  }

  /* Soft off-white hearts around the cover edges only */
  .banner-hearts {
    position: absolute; left: 0; top: 0; width: 100%; height: 57.5%;
    z-index: 4; pointer-events: none; overflow: visible;
  }
  .banner-heart {
    position: absolute; width: var(--s); height: var(--s);
    left: var(--x); top: var(--y);
    color: #f3eee3; opacity: 0;
    filter: drop-shadow(0 0 5px rgba(246,241,230,.62)) drop-shadow(0 0 9px rgba(246,241,230,.22));
    animation: edgeHeartFade var(--dur, 5.8s) ease-in-out var(--delay, 0s) infinite;
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
  }
  .banner-heart svg { width: 100%; height: 100%; display: block; }
  @keyframes edgeHeartFade {
    0%, 100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(.78); }
    38%, 62% { opacity: .88; transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1); }
  }

  /* ---------- avatar ---------- */
  .avatar {
    position: absolute;
    left: 50%; top: 57.5%;
    width: 24%; aspect-ratio: 1;
    z-index: 3;
    transform: translate(-50%, -52%);
    border-radius: 50%;
    border: 2px solid #f1f1f1;
    background: #111;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,255,255,.26), 0 0 26px rgba(255,255,255,.09);
    animation: lightAvatar 7s ease-in-out infinite alternate;
  }
  @keyframes lightAvatar {
    to { box-shadow: 0 0 12px rgba(255,255,255,.34), 0 0 34px rgba(255,255,255,.13); }
  }

  .avatar-frame {
    position: absolute; left: 50%; top: 57.5%;
    width: 30%; aspect-ratio: 1; height: auto;
    z-index: 6; transform: translate(-50%, -52%);
    object-fit: contain; pointer-events: none;
    filter: brightness(0) invert(1) sepia(.10) saturate(.35)
      drop-shadow(0 0 3px rgba(246,241,230,.52))
      drop-shadow(0 0 9px rgba(246,241,230,.26));
  }
  .avatar-frame-glow {
    position: absolute; left: 50%; top: 57.5%; width: 29%; aspect-ratio: 1;
    z-index: 5; transform: translate(-50%, -52%); border-radius: 50%;
    pointer-events: none;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 270deg,
      rgba(246,241,230,0) 300deg, rgba(246,241,230,.72) 333deg,
      rgba(255,255,255,.12) 346deg, transparent 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 1px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 1px));
    filter: drop-shadow(0 0 4px rgba(246,241,230,.7));
    animation: orbitGlow 8s linear infinite;
  }
  @keyframes orbitGlow { to { transform: translate(-50%, -52%) rotate(360deg); } }

  .banner img, .avatar img {
    width: 100%; height: 100%; display: block; object-fit: cover;
    filter: var(--grade);
  }

  .banner img {
    transform: scale(1.10);
    transform-origin: center center;
    /* Slightly reframe the source so the woman and man sit more centrally,
       while keeping the existing slow zoom animation intact. */
    object-position: 55% 50%;
    animation: gentleCoverZoom 15s ease-in-out infinite alternate;
    will-change: transform;
  }

  @keyframes gentleCoverZoom {
    0%   { transform: scale(1.09); }
    50%  { transform: scale(1.14); }
    100% { transform: scale(1.10); }
  }
  .banner::after, .avatar::after {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: var(--tint); mix-blend-mode: soft-light; pointer-events: none;
  }
  canvas.glitter {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 1; pointer-events: none;
  }

  /* ---------- Tree of Gondor + quotes ---------- */
  .tree {
    position: absolute;
    left: 50%;
    top: 79.5%;
    width: clamp(145px, 25vw, 185px);
    height: auto;
    z-index: 5;
    transform: translate(-50%, -50%);
    opacity: .92;
    filter: brightness(0) invert(1) sepia(.08) saturate(.22) drop-shadow(0 0 5px rgba(246,241,230,.95)) drop-shadow(0 0 13px rgba(246,241,230,.72)) drop-shadow(0 0 24px rgba(246,241,230,.42));
    mix-blend-mode: screen;
    pointer-events: none;
    animation: treeFade 7s ease-in-out infinite;
  }

  @keyframes treeFade {
    0%, 100% { opacity: .78; filter: brightness(0) invert(1) sepia(.08) saturate(.22) drop-shadow(0 0 7px rgba(246,241,230,.95)) drop-shadow(0 0 16px rgba(246,241,230,.75)) drop-shadow(0 0 28px rgba(246,241,230,.48)); }
    50%      { opacity: 1; filter: brightness(0) invert(1) sepia(.08) saturate(.22) drop-shadow(0 0 10px rgba(255,255,255,1)) drop-shadow(0 0 22px rgba(246,241,230,.95)) drop-shadow(0 0 38px rgba(246,241,230,.68)); }
  }

  .quotes {
    position: absolute;
    left: 50%;
    top: 90.5%;
    width: min(92%, 620px);
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(7px, 1.2vw, 10px);
    pointer-events: none;
    text-align: center;
  }

  .quote {
    width: 100%;
    color: rgba(246, 241, 230, .88);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(9px, 1.65vw, 14px);
    line-height: 1.3;
    font-weight: 400;
    letter-spacing: .025em;
    text-align: center;
    text-shadow: 0 0 5px rgba(255,250,238,.42), 0 0 12px rgba(255,250,238,.24), 0 0 20px rgba(255,250,238,.10);
    opacity: 0;
    animation: quoteReveal 2.2s ease-out forwards, quoteGlow 5.5s ease-in-out infinite 2.2s;
  }

  .quote:nth-child(2) { animation-delay: 2.0s, 4.2s; }
  .quote:nth-child(3) { animation-delay: 4.0s, 6.2s; }

  @keyframes quoteReveal {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: .88; transform: translateY(0); }
  }

  /* Glow changes only; the quote opacity itself does not loop. */
  @keyframes quoteGlow {
    0%, 100% { text-shadow: 0 0 4px rgba(255,250,238,.28), 0 0 10px rgba(255,250,238,.18); }
    50%      { text-shadow: 0 0 8px rgba(255,250,238,.82), 0 0 18px rgba(255,250,238,.55), 0 0 30px rgba(255,250,238,.28); }
  }

  .music {
    position: fixed;
    width: 1px; height: 1px;
    left: -9999px; top: -9999px;
    opacity: 0; pointer-events: none;
  }

  @media (max-width: 520px) {
    .card { width: 94vw; }
    .banner { border-radius: 11px; }
    .avatar { width: 25%; }
    .tree { top: 79.5%; width: 145px; }
    .avatar-frame { width: 32%; }
    .avatar-frame-glow { width: 31%; }
    .quotes { top: 88.5%; width: 93%; gap: 5px; }
    .quote { font-size: clamp(8px, 2.15vw, 11px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .banner, .avatar, .banner img, .tree, .quote, .banner-heart, .avatar-frame-glow { animation: none; }
  }
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<canvas class="glitterBack" id="glitterBack" aria-hidden="true"></canvas>

<!-- heart symbol with a soft fade -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="heartFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#f3eee3" stop-opacity=".4"/>
    </linearGradient>
    <symbol id="heart" viewBox="0 0 24 24">
      <path fill="url(#heartFade)" d="M12 21.350l-1.450-1.320C5.400 15.360 2 12.280 2 8.500 2 5.420 4.420 3 7.500 3c1.740 0 3.410.810 4.500 2.090C13.090 3.810 14.760 3 16.500 3 19.580 3 22 5.420 22 8.500c0 3.780-3.400 6.860-8.550 11.540L12 21.350z"/>
    </symbol>
  </defs>
</svg>

<div class="card">
  <div class="banner" id="banner" title="Click to change cover">
    <img id="cover" alt="" referrerpolicy="no-referrer">
    <canvas class="glitter" id="glitterCover" aria-hidden="true"></canvas>
  </div>

  <div class="avatar" id="avatar" title="Click to change avatar">
    <img id="photo" alt="" referrerpolicy="no-referrer">
  </div>
  <div class="banner-hearts" id="bannerHearts" aria-hidden="true"></div>
  <div class="avatar-frame-glow" aria-hidden="true"></div>
  <img class="avatar-frame" alt="" src="https://i.ibb.co/NnWCChZw/image-5919888a-removebg-preview.png" referrerpolicy="no-referrer">

  <img class="tree" id="tree" alt="Tree of Gondor" src="https://i.ibb.co/ZpVMCPqf/image-2d0e5d6-removebg-preview.png" referrerpolicy="no-referrer">

  <div class="quotes" aria-hidden="true">
    <div class="quote">&quot;I thought I had strayed into a dream.&quot;</div>
    <div class="quote">&quot;Long years have passed... You did not have the cares you bear now.&quot;</div>
    <div class="quote">&quot;Long years have passed... You have not changed.&quot;</div>
  </div>
</div>

<iframe class="music" id="music"
  src="https://www.youtube.com/embed/2mu6faleFUg?autoplay=1&mute=0&loop=1&playlist=2mu6faleFUg&controls=0&rel=0&playsinline=1&enablejsapi=1"
  title="Background music" allow="autoplay; encrypted-media; picture-in-picture"
  tabindex="-1"></iframe>

<input type="file" id="file" accept="image/*" hidden>

<script>
/* ---------- your images ---------- */
const CONFIG = {
  cover: "https://i.ibb.co/rfxQR8sD/adjusted-image.jpg",
  avatar: "https://i.ibb.co/4gSxr5dj/bedac1ee4b8a870b94cfbeb35fe71c72.jpg"
};

function setCover(url) {
  document.getElementById("cover").src = url;
  document.getElementById("backdrop").style.backgroundImage = `url("${url}")`;
}
setCover(CONFIG.cover);
document.getElementById("photo").src = CONFIG.avatar;

/* Off-white hearts fade in/out along the cover edges (not over the images). */
const edgeHeartPositions = [
  [8, 0, 29, -12], [30, 0, 26, 10], [67, 0, 28, 8], [92, 0, 31, -8],
  [100, 27, 27, 12], [100, 73, 30, -10], [82, 100, 27, 9], [54, 100, 30, -12],
  [22, 100, 26, 8], [0, 72, 29, -12], [0, 32, 26, 10]
];
const edgeHeartLayer = document.getElementById("bannerHearts");
edgeHeartPositions.forEach(([x, y, size, rot], i) => {
  const el = document.createElement("span");
  el.className = "banner-heart";
  el.style.setProperty("--x", `${x}%`);
  el.style.setProperty("--y", `${y}%`);
  el.style.setProperty("--s", `clamp(${size}px, ${size / 700 * 94}vw, ${size + 5}px)`);
  el.style.setProperty("--rot", `${rot}deg`);
  el.style.setProperty("--delay", `${i * .42}s`);
  el.style.setProperty("--dur", `${5.4 + (i % 4) * .45}s`);
  el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"></use></svg>';
  edgeHeartLayer.appendChild(el);
});

/* click banner / avatar to try another image */
const file = document.getElementById("file");
let target = null;
document.getElementById("banner").addEventListener("click", () => { target = "cover"; file.click(); });
document.getElementById("avatar").addEventListener("click", () => { target = "photo"; file.click(); });
file.addEventListener("change", () => {
  const f = file.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  if (target === "cover") setCover(url); else document.getElementById("photo").src = url;
  file.value = "";
});

/* ---------- soft falling heart glitter ---------- */
function glitter(canvas, count, falling = false) {
  const ctx = canvas.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0;
  function fit() {
    const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    W = canvas.width = Math.round(r.width * d);
    H = canvas.height = Math.round(r.height * d);
  }
  new ResizeObserver(fit).observe(canvas); fit();

  const hearts = Array.from({ length: count }, () => ({
    x: Math.random(),
    y: Math.random(),
    vy: falling ? (0.55 + Math.random() * 0.75) * 1e-5 : (Math.random() - .5) * 7e-6,
    vx: (Math.random() - .5) * (falling ? 0.55e-5 : 7e-6),
    size: falling ? 2.1 + Math.random() * 3.5 : 1.8 + Math.random() * 2.8,
    phase: Math.random() * 6.28,
    speed: .35 + Math.random() * .65,
    drift: Math.random() * 6.28,
    c: Math.random() < .78 ? "246,241,230" : "255,236,226"
  }));

  function heartPath(ctx, x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, s * .72);
    ctx.bezierCurveTo(-s * 1.35, -s * .12, -s * .85, -s * .92, 0, -s * .30);
    ctx.bezierCurveTo(s * .85, -s * .92, s * 1.35, -s * .12, 0, s * .72);
    ctx.closePath();
    ctx.restore();
  }

  let last = 0;
  function draw(t) {
    const dt = last ? Math.min(t - last, 60) : 16; last = t;
    ctx.clearRect(0, 0, W, H);
    const scale = Math.max(W / 700, .6);

    for (const h of hearts) {
      h.x += h.vx * dt + Math.sin(t * .00035 * h.speed + h.drift) * 1.2e-7 * dt;
      h.y += h.vy * dt;
      if (h.y > 1.08) { h.y = -.06; h.x = Math.random(); }
      if (h.x < -.05) h.x = 1.05;
      if (h.x > 1.05) h.x = -.05;

      const tw = .5 + .5 * Math.sin(t * .001 * h.speed + h.phase);
      const a = Math.pow(tw, 2.5) * (falling ? .62 : .82);
      if (a < .018) continue;

      const px = h.x * W, py = h.y * H;
      const s = h.size * scale;
      ctx.fillStyle = `rgba(${h.c},${a})`;
      heartPath(ctx, px, py, s);
      ctx.fill();

      /* tiny halo for a soft, cinematic sparkle */
      ctx.shadowColor = `rgba(${h.c},${a * .45})`;
      ctx.shadowBlur = Math.max(1, s * .7);
      heartPath(ctx, px, py, s * .72);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

glitter(document.getElementById("glitterBack"), 125, true);

/* Quiet, slow-moving pinprick glitter across the cover image. */
function coverGlitter(canvas, count = 52) {
  const ctx = canvas.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0;
  function fit() {
    const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    W = canvas.width = Math.round(r.width * d);
    H = canvas.height = Math.round(r.height * d);
  }
  new ResizeObserver(fit).observe(canvas); fit();
  const sparks = Array.from({ length: count }, () => ({
    x: Math.random(), y: Math.random(), size: .7 + Math.random() * 1.35,
    phase: Math.random() * Math.PI * 2, speed: .25 + Math.random() * .45,
    drift: (Math.random() - .5) * .000012
  }));
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const scale = Math.max(W / 700, .6);
    for (const p of sparks) {
      p.x += p.drift;
      if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
      const twinkle = Math.max(0, Math.sin(t * .00055 * p.speed + p.phase));
      const a = .12 + twinkle * .62;
      const x = p.x * W, y = p.y * H, r = p.size * scale;
      ctx.fillStyle = `rgba(255,198,92,${a})`;
      ctx.shadowColor = `rgba(255,181,55,${a * .85})`;
      ctx.shadowBlur = r * 3;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      if (twinkle > .78) {
        ctx.globalAlpha = (twinkle - .78) * 2.2;
        ctx.fillRect(x - r * 2.2, y - .45 * scale, r * 4.4, .9 * scale);
        ctx.fillRect(x - .45 * scale, y - r * 2.2, .9 * scale, r * 4.4);
        ctx.globalAlpha = 1;
      }
    }
    ctx.shadowBlur = 0;
    if (!reduce) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
coverGlitter(document.getElementById("glitterCover"));

// YouTube autoplay is subject to the browser's autoplay policy.
// The first user interaction also sends a play/unmute command.
const music = document.getElementById("music");
function startMusic() {
  music.contentWindow?.postMessage(JSON.stringify({ event: "command", func: "playVideo", args: [] }), "*");
  music.contentWindow?.postMessage(JSON.stringify({ event: "command", func: "unMute", args: [] }), "*");
}
window.addEventListener("pointerdown", startMusic, { once: true });
window.addEventListener("keydown", startMusic, { once: true });
</script>
</body>
</html>
